name: Tapedeck
description: Replay your agent against recorded tapes and fail the PR when behavior regresses.
author: Pearl Yu
branding:
  icon: activity
  color: blue

inputs:
  config:
    description: Path to tapedeck.yaml.
    default: tapedeck.yaml
  prompt:
    description: Prompt file to test (default is the config's prompt).
    default: ""
  runs:
    description: Runs per case (default is the config's runs).
    default: ""
  budget:
    description: Abort above this estimated cost in USD (default is the config's budget_usd).
    default: ""
  comment:
    description: Post or update a sticky comment on the pull request.
    default: "true"
  python-version:
    description: Python version to run with.
    default: "3.12"

outputs:
  passed:
    description: "\"true\" when no case regressed."
    value: ${{ steps.test.outputs.passed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Tapedeck
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Run Tapedeck
      id: test
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_RUNS: ${{ inputs.runs }}
        INPUT_BUDGET: ${{ inputs.budget }}
      run: |
        set +e
        args=(test --config "$INPUT_CONFIG" --md "$RUNNER_TEMP/tapedeck.md" --html "$RUNNER_TEMP/tapedeck-report.html")
        [ -n "$INPUT_PROMPT" ] && args+=(--prompt "$INPUT_PROMPT")
        [ -n "$INPUT_RUNS" ] && args+=(--runs "$INPUT_RUNS")
        [ -n "$INPUT_BUDGET" ] && args+=(--budget "$INPUT_BUDGET")
        [ -n "$TAPEDECK_TOKEN" ] && args+=(--upload)
        tapedeck "${args[@]}"
        code=$?
        echo "code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" = 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
        if [ -f "$RUNNER_TEMP/tapedeck.md" ]; then cat "$RUNNER_TEMP/tapedeck.md" >> "$GITHUB_STEP_SUMMARY"; fi

    - name: Upload HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tapedeck-report
        path: ${{ runner.temp }}/tapedeck-report.html
        if-no-files-found: ignore

    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        body="$RUNNER_TEMP/tapedeck.md"
        if [ ! -f "$body" ]; then
          printf '<!-- tapedeck -->\n### ⚠️ Tapedeck could not run\nSee the workflow log.\n' > "$body"
        fi
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- tapedeck -->")) | .id' 2>/dev/null | head -n 1)
        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$body" > /dev/null
        else
          gh api --method POST "repos/$REPO/issues/$PR/comments" -F "body=@$body" > /dev/null
        fi || echo "::notice::Could not comment (fork PRs get a read-only token); see the job summary."

    - name: Set result
      shell: bash
      run: exit ${{ steps.test.outputs.code }}
